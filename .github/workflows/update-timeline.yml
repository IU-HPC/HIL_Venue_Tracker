name: Update Timeline

# Runs when venue data or generators change, monthly on the 1st, or manually.
on:
  push:
    branches: [main]
    paths:
      - 'venues.csv'
      - 'events.csv'
      - 'venue_data.py'
      - 'validate_data.py'
      - 'timeline_generator.py'
      - 'generate_ical.py'
      - 'report.py'
      - 'tests/**'
  schedule:
    - cron: '0 6 1 * *'   # 1st of every month at 06:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install matplotlib

      - name: Validate venue data
        run: python validate_data.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate timeline image
        env:
          MPLBACKEND: Agg   # headless — no display needed
        run: python timeline_generator.py --no-show --output conference_timeline.png

      - name: Regenerate full-venue timeline
        env:
          MPLBACKEND: Agg
        run: python timeline_generator.py --no-show --show-all --output conference_timeline_all.png

      - name: Regenerate iCal file
        run: python generate_ical.py --output deadlines.ics

      - name: Commit updated artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: regenerate venue timeline and calendar [skip ci]"
          file_pattern: "conference_timeline.png conference_timeline_all.png deadlines.ics"
